<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Prayer Request - Blessed Board</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        h1 { font-size: 32px; color: #1a2b4a; font-weight: 700; }
        .subtitle { font-size: 14px; color: #6b7c93; margin-top: 4px; }
        .back-btn {
            background: white;
            border: 2px solid #e0e6f0;
            color: #1a2b4a;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: border-color .2s, color .2s;
        }
        .back-btn:hover { border-color: #4a90e2; color: #4a90e2; }
        .form-container { background: white; border-radius: 24px; padding: 48px; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-bottom: 28px; }
        .form-row.single { grid-template-columns: 1fr; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #1a2b4a;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: .6px;
        }
        .required { color: #e74c3c; }
        input[type="text"], input[type="email"], input[type="tel"], textarea, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e6f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #f8f9fb;
            transition: border-color .2s, box-shadow .2s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #4a90e2;
            background: white;
            box-shadow: 0 0 0 3px rgba(74,144,226,.12);
        }
        input::placeholder, textarea::placeholder { color: #a8b3c1; }
        textarea { resize: vertical; min-height: 120px; }
        .button-group { display: flex; gap: 14px; margin-top: 36px; }
        .btn {
            padding: 13px 36px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: .5px;
            transition: background .2s, transform .15s;
        }
        .btn-submit { background: #1a2b4a; color: white; }
        .btn-submit:hover { background: #0d1620; transform: translateY(-1px); }
        .btn-clear { background: #e0e6f0; color: #6b7c93; }
        .btn-clear:hover { background: #d0d8e4; }
        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-box { background: white; padding: 36px 32px; border-radius: 20px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
        .modal-icon { font-size: 48px; margin-bottom: 14px; }
        .modal-title { font-size: 20px; font-weight: 700; color: #1a2b4a; margin-bottom: 10px; }
        .modal-msg { font-size: 14px; color: #6b7c93; margin-bottom: 24px; line-height: 1.6; }
        .modal-ok { background: #1a2b4a; color: white; border: none; padding: 11px 30px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .modal-ok:hover { background: #0d1620; }
        @media (max-width: 700px) {
            .header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .form-container { padding: 28px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>Submit Prayer Request</h1>
            <p class="subtitle">Add a new prayer request to track</p>
        </div>
        <a href="INDEX.html" class="back-btn">Back to home</a>
    </div>

    <div class="form-container">
        <form id="prayerForm">
            <div class="form-row">
                <div>
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                </div>
                <div>
                    <label>Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label>Contact Number</label>
                    <input type="tel" id="contact" name="contact" placeholder="Optional phone number (11 digits)" maxlength="11">
                </div>
            </div>

            <div class="form-row single">
                <div>
                    <label>Prayer Request Title <span class="required">*</span></label>
                    <input type="text" id="title" name="title" placeholder="Brief summary of your prayer request" required>
                </div>
            </div>

            <div class="form-row single">
                <div>
                    <label>Description <span class="required">*</span></label>
                    <textarea id="description" name="description" placeholder="Detailed description of the prayer request" required></textarea>
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label>Category <span class="required">*</span></label>
                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="Family">Family</option>
                        <option value="Health">Health</option>
                        <option value="Career">Career</option>
                        <option value="Spiritual Growth">Spiritual Growth</option>
                        <option value="Financial">Financial</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-submit">Submit Request</button>
                <button type="reset" class="btn btn-clear">Clear</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-box">
        <div class="modal-icon" id="mIcon">✅</div>
        <div class="modal-title" id="mTitle">Success</div>
        <div class="modal-msg"   id="mMsg"></div>
        <button class="modal-ok" id="mOk">OK</button>
    </div>
</div>

<script>
    function showModal(icon, title, msg, cb) {
        document.getElementById('mIcon').textContent  = icon;
        document.getElementById('mTitle').textContent = title;
        document.getElementById('mMsg').textContent   = msg;
        document.getElementById('modal').classList.add('show');
        document.getElementById('mOk').onclick = function () {
            document.getElementById('modal').classList.remove('show');
            if (cb) cb();
        };
    }

    // Numbers-only contact field
    document.getElementById('contact').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 11);
    });

    document.getElementById('prayerForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const body = new FormData();
        body.append('full_name',      document.getElementById('fullName').value.trim());
        body.append('email',          document.getElementById('email').value.trim());
        body.append('contact_number', document.getElementById('contact').value.trim());
        body.append('title',          document.getElementById('title').value.trim());
        body.append('description',    document.getElementById('description').value.trim());
        body.append('category',       document.getElementById('category').value);

        try {
            const res  = await fetch('submit_prayer.php', { method: 'POST', body });
            const json = await res.json();

            if (json.status === 'success') {
                showModal('✅', 'Prayer Submitted!', json.message, () => {
                    document.getElementById('prayerForm').reset();
                });
            } else {
                showModal('⚠️', 'Submission Failed', json.message || 'Something went wrong.');
            }
        } catch (err) {
            showModal('❌', 'Network Error', 'Could not reach the server. Make sure XAMPP is running.');
        }
    });
</script>
</body>
</html>
